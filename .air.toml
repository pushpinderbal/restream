root = "."
tmp_dir = "bin/air"
env_files = [".env"]

[build]
cmd = "go build -o ./bin/air/restream ./cmd/restream"
entrypoint = ["./bin/air/restream", "--dev"]
include_dir = ["cmd", "internal"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["bin", "data", "web", ".git"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "12s"

[misc]
clean_on_exit = true
