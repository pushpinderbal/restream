[tools]
air = "1.67.4"
bun = "1.4.0"
ffmpeg = "9.0.2"
go = "1.27"
node = "26.8.1"

[tasks.dev]
description = "Run the local Go API and Vite UI with automatic reloads"
depends = ["dev:api", "dev:web"]

[tasks."dev:api"]
description = "Run the local Go API with Air"
run = "air"

[tasks."dev:web"]
description = "Run the local Vite UI on localhost:5173"
dir = "web"
run = ["bun install --frozen-lockfile", "bun run dev -- --port 5173 --strictPort"]

[tasks.build]
description = "Build the Go binary for local development and checks"
run = "go build -o bin/restream ./cmd/restream"

[tasks.frontend]
description = "Build frontend assets for local checks and playback tests"
dir = "web"
run = ["bun install --frozen-lockfile", "bun run build"]

[tasks.test]
description = "Run Go tests against the simulated portal"
run = "go test ./..."

[tasks."test:browser"]
description = "Run browser workflow tests"
dir = "web"
run = ["bun install --frozen-lockfile", 'if [ -z "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}" ]; then node node_modules/@playwright/test/cli.js install chromium; fi', "bun run test:browser"]

[tasks."test:playback"]
description = "Run FFmpeg-to-browser integration test"
depends = ["frontend"]
run = ['if [ -z "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}" ]; then cd web && node node_modules/@playwright/test/cli.js install chromium; fi', "RESTREAM_BROWSER_TESTS=1 go test ./internal/app -run '^TestPortalToBrowserPlayback$' -count=1 -v"]

[tasks."test:container"]
description = "Build and smoke-test the packaged app using temporary containers and storage"
run = "bun scripts/test-container.mjs"
